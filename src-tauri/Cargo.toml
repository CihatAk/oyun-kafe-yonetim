[package]
name = "oyun-kafe-yonetim"
version = "2.0.7"
description = "JiJi Game Center - PlayStation & VR"
authors = ["JiJi Game Center"]
license = "MIT"
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "shell-open", "window-set-fullscreen", "dialog-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
rusqlite = { version = "0.31", features = ["bundled"] }
dirs = "5.0"
csv = "1.3"
sha2 = "0.10"
argon2 = "0.5"
ed25519-dalek = "2"
winreg = "0.52"
tiny_http = "0.12"
local-ip-address = "0.6"
reqwest = { version = "0.11", features = ["json", "blocking"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
