  # Ed25519 dogrulama public key (license.rs DEFAULT_PUBLIC_KEY_HEX)
  '''77ca90c4e4d5cb1f7b520aa18bae7e2ffcbaede5bd314aab0ccc77a3cc093559''',
  # lisans sunucusu adresi
  '''lbgnrdozipzbcexvsboe''',
]
