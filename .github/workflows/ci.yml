name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks ile sir taramasi
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Yasakli dosya kontrolu (gizli dosyalar repoya girmemeli)
        run: |
          if git ls-files | grep -Ei '(^|/)(supabase\.json|license-config\.json|NOTES\.md|bilgi\.txt|secretkey\.txt|publickey\.txt)$|\.(key|pub)$'; then
            echo "::error::Gizli dosya repoya eklenmis. Kaldirin: .gitignore'a alinmis dosyalar track edilmemeli."
            exit 1
          fi
          echo "Gizli dosya kontrolu: TEMIZ"

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev build-essential \
            curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build
        working-directory: src-tauri
        run: cargo build

      - name: Test
        working-directory: src-tauri
        run: cargo test
